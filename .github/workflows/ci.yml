name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Package tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Cache SPM build
        uses: actions/cache@v5
        with:
          path: Packages/FreshlyCore/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('Packages/FreshlyCore/Package.swift', 'Packages/FreshlyCore/Sources/**') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Run FreshlyCore tests
        run: scripts/verify.sh core

  build:
    name: App build and tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Cache DerivedData
        uses: actions/cache@v5
        with:
          path: /tmp/FreshlyDerivedData
          key: ${{ runner.os }}-dd-${{ hashFiles('Freshly/**', 'FreshlyTests/**', 'Freshly.xcodeproj/**', 'Packages/FreshlyCore/Sources/**') }}
          restore-keys: |
            ${{ runner.os }}-dd-
      - name: Build and test (unsigned)
        run: scripts/verify.sh app

  definitions:
    name: Validate app definitions
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Cache SPM build
        uses: actions/cache@v5
        with:
          path: Packages/FreshlyCore/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('Packages/FreshlyCore/Package.swift', 'Packages/FreshlyCore/Sources/**') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      - name: Validate and repack
        run: scripts/verify.sh definitions

  localization:
    name: Localization check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Check String Catalog coverage
        run: scripts/verify.sh localization
